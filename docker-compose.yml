services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: storecouncil
      POSTGRES_PASSWORD: storecouncil
      POSTGRES_DB: storecouncil
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storecouncil"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

# Dev usage:
#   docker compose up -d postgres
#   DATABASE_URL=postgres://storecouncil:storecouncil@localhost:5432/storecouncil npm run migrate
